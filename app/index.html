      THESIS: Illegal fishing happens after dark; the evidence is read the same way. Each finding is a light on a night sea, and the visualization is the page. Refuses the boxed report and the neon dashboard.
      OWN-WORLD: Abyssal water (#07111b) with moonlight text; light lives only in data (bioluminescent teal, amber, rose-red, blue marks drawn additively) and in signal lamps (ICS flags edged in moonlight) that carry verdicts. Bodoni Moda chart lettering for the story, Archivo for the interface, JetBrains Mono for measurements. Chrome never glows.
      STORY: Each challenge is a chapter told on a full-bleed sticky stage; text steps scroll past and drive it; every claim lights its evidence; verdicts hoist as lamps.
      FIRST VIEWPORT: Serif title left over the dark; on the right the night hoist (lit verdict flags on a halyard) above a field of drifting trade lights; three challenge lamps as the primary path.
